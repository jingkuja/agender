[project]
name = "agender-worker"
version = "0.1.0"
description = "AI-dispatched browsing worker for Douyin, Xiaohongshu, Weibo, Bilibili and web research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "pydantic>=2.8",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "trafilatura>=1.12",
    "readability-lxml>=0.8",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "prometheus-client>=0.21",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "ruff>=0.6",
]

[project.scripts]
agender-worker = "agender.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agender = ["protocol/jsonschema/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: hits the network or a real browser; skipped in CI",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B017", "B904", "E501", "UP036", "UP042"]
