name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: sync
        run: uv sync --extra dev
      - name: ruff
        run: uv run ruff check src tests
      - name: pytest
        run: uv run pytest -q
      - name: jsonschema export present
        run: uv run python -m agender.protocol.export_schema
